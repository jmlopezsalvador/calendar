name: iosApp
options:
  bundleIdPrefix: com.calendar
  deploymentTarget: { iOS: "15.0" }
  createIntermediateGroups: true
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Calendar
        CFBundleIcons:
          CFBundleAlternateIcons:
            alt_google:
              CFBundleIconFiles: [alt_google]
            alt_samsung:
              CFBundleIconFiles: [alt_samsung]
            alt_apple:
              CFBundleIconFiles: [alt_apple]
            alt_xiaomi:
              CFBundleIconFiles: [alt_xiaomi]
            alt_xiaomi_google:
              CFBundleIconFiles: [alt_xiaomi_google]
            alt_oppo_google:
              CFBundleIconFiles: [alt_oppo_google]
            alt_huawei:
              CFBundleIconFiles: [alt_huawei]
            alt_business:
              CFBundleIconFiles: [alt_business]
            alt_moca:
              CFBundleIconFiles: [alt_moca]
            alt_acalendar:
              CFBundleIconFiles: [alt_acalendar]
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calendar
        PRODUCT_NAME: Calendar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
    preBuildScripts:
      - name: Compilar Kotlin (Gradle)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
